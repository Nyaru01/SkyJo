:root {
    color-scheme: dark;
    font: 16px/1.5 system-ui, sans-serif;
    color: #f7ede1;
    background: #151727;
}
* { box-sizing: border-box; }
body {
    margin: 0;
    background: radial-gradient(ellipse at 80% 0%, #39293f, transparent 46rem), #151727;
}
main { max-width: 85rem; margin: auto; padding: 2.75rem clamp(1rem, 4vw, 3.5rem); }
h1, h2, h3, p, figure { margin: 0; }
h1 { font: 400 clamp(2.5rem, 7vw, 4.5rem)/1.05 Georgia, serif; letter-spacing: -.045em; }
h2 { font: 400 1.65rem/1.2 Georgia, serif; }
h3 { font-size: .83rem; font-weight: 600; color: #d6c4ba; }
p, figcaption { color: #d6c4ba; font-size: .875rem; }
header { padding-bottom: 1.5rem; }
header p { margin-top: .55rem; color: #efbf9f; }
section { padding: 1.2rem 0; border-top: 1px solid #f9d9bd26; }
.gallery { display: grid; gap: .8rem; margin-top: 1rem; }
.pairs { display: grid; grid-template-columns: repeat(auto-fit, minmax(3.55rem, max-content)); gap: .65rem .7rem; }
.pair { display: grid; align-content: start; justify-items: center; gap: .35rem; min-width: 0; }
.pair figcaption { font-size: .72rem; text-align: center; }
.examples { display: flex; flex-wrap: wrap; gap: 1.5rem clamp(2rem, 6vw, 5rem); }

#states figure { display: grid; justify-items: center; gap: .75rem; }
.simulation-heading { display: flex; flex-wrap: wrap; align-items: center; gap: .55rem 1rem; margin-bottom: .9rem; }
.filter-control { display: inline-flex; align-items: center; gap: .5rem; color: #d6c4ba; font-size: .875rem; cursor: pointer; }

.simulation .pairs { gap: .4rem; grid-template-columns: repeat(auto-fit, minmax(clamp(2.25rem, 7vw, 3.25rem), max-content)); }
.simulation:has(input:checked) .card { filter: url(#deuteranopia); }
.card {
    --ink: #131427;
    --w: clamp(2.7rem, 7.5vw, 3.8rem);
    --h: clamp(3.6rem, 10vh, 4.8rem);
    --number: clamp(1.5rem, 4vw, 2.1rem);
    --corner: .62rem;
    position: relative;
    isolation: isolate;
    width: var(--w);
    height: var(--h);
    display: grid;
    place-items: center;
    color: var(--ink);
    border: 1px solid #ffeeccd9;
    border-top-color: #fff6e1;
    border-bottom-color: #b9987f;
    border-radius: .52rem;
    background: radial-gradient(ellipse 110% 64% at 20% -10%, #fff9ed45, transparent 75%),
        linear-gradient(165deg, var(--sky) 8%, var(--horizon) 100%);
    box-shadow: 0 3px 0 #100f20, 0 7px 10px #090b1680, inset 0 1px #fff7e344, inset 0 -2px #08091455;
    font-family: Nunito, system-ui, sans-serif;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
}
.card::before {
    content: "";
    position: absolute;
    inset: 2px;
    border-radius: .37rem;
    box-shadow: inset 0 1px 0 #fff4db1f;
    pointer-events: none;
}
.card--xs {
    --w: clamp(2.25rem, 7vw, 3.25rem);
    --h: clamp(2.25rem, 7.5vh, 3.375rem);
    --number: clamp(.95rem, 2.8vw, 1.4rem);
    --corner: .46rem;
    border-radius: .43rem;
}
.number, .corner { position: relative; z-index: 1; line-height: 1; }
.number { transform: translateY(-34%); font-size: var(--number); letter-spacing: -.045em; text-shadow: 0 1px #fff7e173; }
.card--wide .number { letter-spacing: -.065em; }
.minus { margin-right: .055em; }
.corner { position: absolute; font-size: var(--corner); }
.corner--top { top: 7%; left: 9%; }
.corner--bottom { bottom: 4%; right: 7%; transform: rotate(180deg); }
.scene { position: absolute; inset: auto 0 7%; width: 100%; height: 40%; color: #292042; }
.scene--sun { bottom: 6%; height: 37%; }
.scene--constellation { color: #69501b; }
.card--action {
    background: radial-gradient(ellipse 120% 78% at 18% -12%, #c0e0ff42, transparent 78%),
        linear-gradient(165deg, var(--sky), var(--horizon));
}
.special { position: relative; width: 62%; height: auto; color: var(--card-accent); }
.card--back {
    border-color: #bdab9f;
    background: radial-gradient(ellipse at 50% 68%, #91709545, transparent 68%),
        linear-gradient(155deg, var(--sky), var(--horizon));
}
.card--back::before {
    inset: 4px;
    border: 1px solid #f9dbb755;
}
.back-emblem { width: 47%; height: auto; color: #f5cfa1; }
.card--selected { outline: 1px solid #fde7ae; outline-offset: 3px; transform: translateY(-2px); box-shadow: 0 0 17px #f6cd7460; }
.card--target { outline: 2px dashed var(--card-accent); outline-offset: 3px; }
.card--disabled { filter: saturate(.32); opacity: .48; }
.definitions { position: absolute; width: 0; height: 0; overflow: hidden; }
@media (max-width: 36rem) {
    main { padding-top: 1.5rem; }
    .pairs { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .75rem .3rem; }
    #values { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    .simulation .pairs { grid-template-columns: repeat(auto-fit, minmax(2.25rem, 1fr)); gap: .5rem .3rem; }
}

<main>
    <header>
        <h1>Les cartes de Vesper</h1>

        <h2 id="range-title">La gamme</h2>
        <div class="gallery">
            <h3>Valeurs courantes · md en haut, xs en bas</h3>
            <div id="values" class="pairs"></div>
            <h3>Cartes spéciales et dos classique · md en haut, xs en bas</h3>
            <div id="specials" class="pairs"></div>
        </div>
    </section>
    <section class="examples" aria-label="Exemples sur la table">
        <div>
            <h2>Sur la table</h2>
            <div class="table"><div id="hand" aria-label="Trois rangées de quatre cartes"></div></div>
        </div>
        <div>
            <h2>États</h2>
            <div class="table" id="states"></div>
        </div>
    </section>

        <div class="simulation-heading">
            <h2 id="simulation-title">Lecture des cartes en xs</h2>
            <label class="filter-control"><input type="checkbox" checked autocomplete="off"> Simuler la deutéranopie à 100 %</label>
        </div>
        <div id="simulation" class="pairs"></div>
    </section>
</main>
<script>
const palettes = {
    "-2": ["#c5cfff", "#8796e0", "#bbc8ff"],
    "-1": ["#a9ddff", "#57abe4", "#a4deff"],
    0: ["#a0f1f1", "#50c5ce", "#97ecf4"],
    1: ["#b0f4d6", "#63cfaa", "#a3efcd"],
    2: ["#c9f1b3", "#86c667", "#b9eb9e"],
    3: ["#e5f09e", "#b9ca51", "#e4ed9a"],
    4: ["#fff3b3", "#e9c85f", "#ffed9e"],
    5: ["#ffe093", "#efa443", "#ffd977"],
    6: ["#ffd3a5", "#f5894f", "#ffc690"],
    7: ["#ffbba5", "#ee7061", "#ffad92"],
    8: ["#ffced0", "#ec8298", "#ffb6cd"],
    9: ["#f9b6dc", "#df68a1", "#f6a9de"],
    10: ["#e7c2f8", "#ab79cb", "#e8bbfa"],
    11: ["#f8a9ce", "#ca6198", "#f3a3cc"],
    12: ["#ffada4", "#ce646a", "#ff998f"],
    "-10": ["#d6b9f8", "#9b72c4", "#e6c6ff"],
    20: ["#ffb6ac", "#db7475", "#ffada3"],
    S: ["#627fa7", "#243555", "#c0fff0"],
    C: ["#697fa7", "#273556", "#f2eaff"],
    CH: ["#637a9e", "#263451", "#ffdc9c"],
    H: ["#596e98", "#202d51", "#ddcdfa"],
    back: ["#18233e", "#412947", "#f5cfa1"],
};
const actions = {
    S: ["swap", "Échange"],
    C: ["clean", "Joker"],
    CH: ["chest", "Coffre"],
    H: ["hole", "Trou noir"],
};
const values = Array.from({ length: 15 }, (_, index) => index - 2);
const specials = [-10, 20, ...Object.keys(actions), "back"];

function icon(content, viewBox, className) {
    return `<svg class="${className}" viewBox="${viewBox}" aria-hidden="true">${content}</svg>`;
}

function scene(value) {
    if (value === -10) {
        const stars = [[8,15],[16,10],[23,14],[29,7],[36,12],[43,8],[52,15],[57,9],[63,16],[49,21]];
        return icon(
            `<polyline points="${stars.map(point => point.join(",")).join(" ")}" fill="none" stroke="currentColor" stroke-width=".6" opacity=".65"/>` +
            stars.map(([x, y]) => `<use href="#star" transform="translate(${x} ${y}) scale(.54)"/>`).join(""),
            "0 0 70 25", "scene scene--constellation"
        );
    }
    if (value === 20) {
        return icon('<circle cx="35" cy="15" r="12" fill="#a32e44" opacity=".55"/><circle cx="35" cy="15" r="8.5" fill="#1a1120" stroke="#ffab84" stroke-width="1.6"/><path d="M27.5 11a8.5 8.5 0 0 1 11-4" fill="none" stroke="#fff0c9" stroke-linecap="round" stroke-width="1.2"/>', "0 0 70 30", "scene");
    }
    if (value < 0) {
        const stars = value === -2 ? '<use href="#star" transform="translate(25 16) scale(1.28)"/><use href="#star" transform="translate(44 12) scale(1.28)"/>' : '<use href="#star" transform="translate(35 15) scale(1.5)"/>';
        return icon(stars, "0 0 70 25", "scene");
    }
    if (value === 0) {
        return icon('<path d="M39 3a10 10 0 1 0 6 15 9.4 9.4 0 0 1-6-15Z" fill="currentColor"/>', "0 0 70 25", "scene");
    }
    const height = 9.6 + (value - 1) * 1.43;
    return icon(
        `<circle cx="32" cy="${height}" r="8.2" fill="#fff2bc" stroke="currentColor" stroke-width="1.7" clip-path="url(#above-horizon)"/>
        <path d="M18 27h28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>`,
        "0 0 64 30", "scene scene--sun"
    );
}

function card(value, size, state = "") {
    const [sky, horizon, accent] = palettes[value];
    const action = actions[value];
    const back = value === "back";
    const label = back ? "Face cachée" : action ? action[1] : String(value).replace("-", "−");
    const number = value < 0 ? `<span class="minus">−</span>${Math.abs(value)}` : label;
    const face = back ? icon('<use href="#evening-star"/>', "0 0 32 32", "back-emblem")
        : action ? icon(`<use href="#${action[0]}"/>`, "0 0 24 24", "special")
        : `${scene(value)}<span class="corner corner--top" aria-hidden="true">${number}</span>
            <span class="number" aria-hidden="true">${number}</span>
            <span class="corner corner--bottom" aria-hidden="true">${number}</span>`;
    return `<div class="card card--${size}${back ? " card--back" : ""}${action ? " card--action" : ""}${value === -10 ? " card--wide" : ""}${state ? " card--" + state : ""}"
        style="--sky:${sky};--horizon:${horizon};--card-accent:${accent}"
        role="img" aria-label="${label}">${face}</div>`;
}

function pair(value) {
    const caption = actions[value]?.[1] ?? (value === "back" ? "Classic" : "");
    return `<figure class="pair">${card(value, "md")}${card(value, "xs")}
        ${caption ? `<figcaption>${caption}</figcaption>` : ""}</figure>`;
}

document.querySelector("#values").innerHTML = values.map(pair).join("");
document.querySelector("#specials").innerHTML = specials.map(pair).join("");
document.querySelector("#hand").innerHTML = [
    "back", -2, "H", "back",
    2, 3, 4, "back",
    6, 7, 8, "back",
].map(value => `<div class="slot">${card(value, "md")}</div>`).join("");
document.querySelector("#states").innerHTML = [
    [4, "selected", "Sélectionnée"],
    [10, "target", "Cible"],
    [-2, "disabled", "Désactivée"],
].map(([value, state, label]) => `<figure>${card(value, "md", state)}<figcaption>${label}</figcaption></figure>`).join("");
document.querySelector("#simulation").innerHTML = [...values, ...specials.slice(0, -1)].map(value => card(value, "xs")).join("");
</script>
