<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title">
<title id="title">Skyjo édition réelle</title>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060918"/>
      <stop offset=".45" stop-color="#0A1030"/>
      <stop offset="1" stop-color="#080B22"/>
    </linearGradient>
<radialGradient id="glowCyan" cx="72%" cy="46%" r="48%">
      <stop offset="0" stop-color="#20DDF7" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#1597FF" stop-opacity=".06"/>
      <stop offset="1" stop-color="#1597FF" stop-opacity="0"/>
    </radialGradient>
<radialGradient id="glowPurple" cx="28%" cy="15%" r="55%">
      <stop offset="0" stop-color="#6D66FF" stop-opacity=".15"/>
      <stop offset="1" stop-color="#6D66FF" stop-opacity="0"/>
    </radialGradient>
<linearGradient id="skyjoGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".28" stop-color="#DFFAFF"/>
      <stop offset=".50" stop-color="#7BEAFF"/>
      <stop offset=".72" stop-color="#D9F7FF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
      <animate attributeName="x1" values="-1;1" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;2" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
<linearGradient id="virtuelGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FE4F8"/>
      <stop offset=".50" stop-color="#B8FAFF"/>
      <stop offset="1" stop-color="#6D8BFF"/>
      <animate attributeName="x1" values="0;1;0" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
<filter id="titleGlow" x="-30%" y="-50%" width="160%" height="200%"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#64e9ff" flood-opacity=".35"/></filter>
</defs>
<rect width="960" height="320" fill="url(#bg)"/><rect width="960" height="320" fill="url(#glowPurple)"/><rect width="960" height="320" fill="url(#glowCyan)"/>
<g fill="none" stroke="#6372e8" stroke-opacity=".17" stroke-width="2"><rect x="80" y="50" width="80" height="96" rx="5" transform="rotate(-10 120 98)"/><rect x="790" y="170" width="65" height="86" rx="5" transform="rotate(12 820 212)"/></g>
<g stroke="#43c9ff" stroke-width="1.5" stroke-opacity=".26"><path d="M65 235h135M730 85h115"/></g>
<g fill="#73d8ff" opacity=".55"><circle cx="219" cy="64" r="2"/><circle cx="772" cy="120" r="2"/><circle cx="700" cy="270" r="1.5"/></g>
<g text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
<text x="480" y="163" font-size="118" font-weight="950" letter-spacing="-5" fill="url(#skyjoGradient)" filter="url(#titleGlow)">SKYJO</text>
<text x="480" y="244" font-size="36" font-weight="900" letter-spacing="10" fill="url(#virtuelGradient)">ÉDITION RÉELLE</text>
</g>
<rect x="323" y="273" width="314" height="2" rx="1" fill="url(#virtuelGradient)" opacity=".7"/><circle cx="480" cy="274" r="4" fill="#b8faff"/>
</svg>